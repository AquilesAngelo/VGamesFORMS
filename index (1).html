<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vieira Games - Pesquisa pré-evento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1230;--bg2:#131d4a;--line:#05091f;--tx:#fff;--mut:#aab6e6;--blue:#2f9be0;--yel:#ffd21f;--red:#e0352b;--px:"Press Start 2P","Courier New",monospace;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Verdana,system-ui,sans-serif;color:var(--tx);background:var(--bg);background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden;animation:grid 12s linear infinite}
@keyframes grid{to{background-position:32px 32px}}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx i{position:absolute;display:block;animation:rise linear infinite;opacity:.5}
@keyframes rise{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-12vh) rotate(180deg)}}
main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:min(320px,72vw);user-select:none;-webkit-user-drag:none;animation:drop .8s cubic-bezier(.3,1.5,.5,1) both,bob 3s ease-in-out .8s infinite;filter:drop-shadow(0 6px 0 rgba(5,9,31,.6))}
@keyframes drop{from{transform:translateY(-140px) scale(.5);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
h1,h2,.btn,.tag{font-family:var(--px);font-weight:400;line-height:1.6}
h1{font-size:1rem;text-align:center;margin:14px 0 8px;color:var(--yel);min-height:1.6em}
h1:after{content:"_";animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h2{font-size:.9rem;margin:10px 0 20px}
p.sub{color:var(--mut);text-align:center;margin:0 0 24px;font-size:.95rem;line-height:1.6;animation:up .6s .5s both}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.menu{display:grid;gap:16px;width:100%}
.btn{border:3px solid var(--line);border-radius:0;padding:16px;font-size:.75rem;cursor:pointer;color:var(--line);background:var(--yel);box-shadow:4px 4px 0 var(--line);width:100%;text-transform:uppercase;position:relative;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
.btn.b{background:var(--blue)}.btn.r{background:var(--red);color:#fff}
.btn.g{background:var(--bg);color:var(--mut);border-color:var(--mut);box-shadow:none}
.btn.start{animation:up .6s .8s both,pulse 1.2s 1.4s steps(2) infinite}
.btn.start:before{content:"\25B6";margin-right:10px}
@keyframes pulse{50%{box-shadow:4px 4px 0 var(--line),0 0 0 6px rgba(255,210,31,.35)}}
.btn:disabled{opacity:.35;pointer-events:none}
.card{background:var(--bg);border:3px solid var(--mut);padding:22px 18px;width:100%;box-shadow:6px 6px 0 var(--line);animation:slide .35s steps(6) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.card.back{animation-name:slideb}
@keyframes slideb{from{transform:translateX(-40px);opacity:0}}
.prog{display:flex;gap:6px;width:100%;margin-bottom:18px}.prog i{flex:1;height:14px;border:2px solid var(--mut);position:relative;overflow:hidden}
.prog i:after{content:"";position:absolute;inset:0;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .5s steps(8)}
.prog i.on:after{transform:scaleX(1)}
.tag{font-size:.65rem;color:var(--blue)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:3px solid var(--bg2);background:var(--bg2);color:var(--tx);padding:14px;font:inherit;font-size:1rem;cursor:pointer;text-align:left;transition:transform .1s,border-color .1s;animation:up .4s both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}.opt:nth-child(5){animation-delay:.28s}.opt:nth-child(6){animation-delay:.35s}
.opt:hover{border-color:var(--blue);transform:translateX(6px)}
.opt:before{content:"";flex:none;width:18px;height:18px;border:3px solid var(--mut);transition:.1s}
.opt.on{border-color:var(--yel);transform:translateX(6px)}.opt.on:before{background:var(--yel);border-color:var(--yel);box-shadow:inset 0 0 0 3px var(--bg2)}
.opt.pop{animation:pop .3s steps(5)}
@keyframes pop{40%{transform:scale(1.05) translateX(6px)}}
.rad:before{border-radius:50%}
label{display:block;margin-top:14px;color:var(--mut);font-size:.9rem}
input,textarea{resize:vertical;width:100%;border:3px solid var(--mut);background:var(--bg2);color:var(--tx);padding:12px;font:inherit;font-size:1rem;margin-top:6px;border-radius:0}
input:focus,textarea:focus{outline:0;border-color:var(--yel)}
.nav{display:flex;gap:12px;margin-top:22px}.nav .btn{flex:1}
.hid{display:none}
.ok{font-size:2.4rem;color:var(--yel);font-family:var(--px);text-align:center;margin:6px 0;animation:pop2 .6s steps(6) both}
@keyframes pop2{from{transform:scale(0)}}
.cf{position:fixed;top:-20px;width:12px;height:12px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
canvas#tc{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5;pointer-events:none;display:none}
body.menu canvas#tc{display:block}body.menu .fx{display:none}
body.menu:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(11,18,48,.8) 0%,rgba(11,18,48,.45) 45%,transparent 75%)}
body.menu h1,body.menu p.sub{text-shadow:0 2px 0 #05091f,0 0 12px #05091f}
.tr{position:fixed;inset:0;z-index:50;overflow:hidden;perspective:1000px;perspective-origin:50% 50%;pointer-events:all}
.pc3{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.sh3{position:absolute;transform-style:preserve-3d}
.cu{position:absolute;left:0;top:0;transform-style:preserve-3d}
.cu i{position:absolute;inset:0;display:block;background:#4cd44c;border:4px solid #05091f;box-shadow:inset 10px 10px 0 rgba(255,255,255,.35),inset -10px -10px 0 rgba(0,0,0,.25);backface-visibility:visible}
.cu .f2{filter:brightness(.6)}.cu .f3{filter:brightness(.75)}.cu .f4{filter:brightness(.8)}.cu .f5{filter:brightness(1.15)}.cu .f6{filter:brightness(.55)}
</style></head><body>

<div class="fx" id="fx" aria-hidden="true"></div>
<main id="app"></main>

g.forEach(row=>{if(row.every(v=>v))lines++});
for(let x=0;x<cols;x++){let y=0;while(y<rows&&!g[y][x])y++;hs.push(rows-y);agg+=rows-y;for(let k=y+1;k<rows;k++)if(!g[k][x])holes++}
for(let x=1;x<cols;x++)bump+=Math.abs(hs[x]-hs[x-1]);
return lines*6-holes*5-agg*.35-bump*.25}
function spawn(){
const i=Math.floor(Math.random()*7);let cs=SH[i].map(x=>x.slice()),opts=[];
for(let k=0;k<4;k++){for(let c=0;c<cols;c++){const s=evalPlace(cs,c);if(s!==null)opts.push({s,cs,c})}cs=rotC(cs)}
if(!opts.length){drain=true;return}
opts.sort((a,b)=>b.s-a.s);const o=Math.random()<.3?opts[Math.min(opts.length-1,Math.floor(Math.random()*3))]:opts[0];
p={cs:o.cs,c:Math.floor(cols/2)-1,r:-2,tc:o.c,col:TC[i]};
if(!fits(p.cs,p.r,p.c)){drain=true;p=null}}
function lock(){p.cs.forEach(([a,b])=>{const y=p.r+a;if(y>=0)grid[y][p.c+b]=p.col});p=null;
const full=[];grid.forEach((row,y)=>{if(row.every(v=>v))full.push(y)});if(full.length){flash=full;fA=0}
const h=grid.findIndex(r=>r.some(v=>v));if(h>=0&&rows-h>rows*.6)drain=true}
function blk(x,y,col){ctx.fillStyle=col;ctx.fillRect(x,y,cell,cell);ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(x,y,cell,3);ctx.fillRect(x,y,3,cell);ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(x,y+cell-3,cell,3);ctx.fillRect(x+cell-3,y,3,cell);ctx.strokeStyle="#05091f";ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,cell-2,cell-2)}
return{
update(dt){
if(wait>0){wait-=dt;return}
if(drain){dA+=dt;if(dA>70){dA=0;grid.pop();grid.unshift(Array(cols).fill(0));const h=grid.findIndex(r=>r.some(v=>v));if(h<0||rows-h<rows*.2)drain=false}}
else if(flash){fA+=dt;if(fA>260){flash.forEach(y=>{grid.splice(y,1);grid.unshift(Array(cols).fill(0))});flash=null}}
else if(!p)spawn();
else{hA+=dt;gA+=dt;
if(hA>85){hA=0;if(p.c!==p.tc){const d=p.tc>p.c?1:-1;if(fits(p.cs,p.r,p.c+d))p.c+=d}}
if(gA>gv){gA=0;if(fits(p.cs,p.r+1,p.c))p.r++;else lock()}}},
draw(){
ctx.strokeStyle="rgba(170,182,230,.18)";ctx.lineWidth=2;ctx.strokeRect(ox-1,0,cols*cell+2,rows*cell+2);
grid.forEach((row,y)=>row.forEach((v,x)=>{if(v)blk(ox+x*cell,y*cell,flash&&flash.includes(y)&&Math.floor(fA/65)%2===0?"#fff":v)}));
if(p)p.cs.forEach(([a,b])=>{if(p.r+a>=0)blk(ox+(p.c+b)*cell,(p.r+a)*cell,p.col)})}}}
function startTetris(){
if(RM)return;stopTetris();
const cv=document.getElementById("tc"),ctx=cv.getContext("2d");
cv.width=innerWidth;cv.height=innerHeight;
const narrow=innerWidth<700,cell=narrow?22:Math.round(Math.max(24,Math.min(32,innerWidth/45))),wc=narrow?7:9,rows=Math.ceil(innerHeight/cell);
const n=Math.min(5,Math.max(2,Math.floor(innerWidth/(cell*(wc+4))))),pitch=innerWidth/n;
const bs=[];for(let i=0;i<n;i++)bs.push(makeBoard(ctx,cell,rows,wc,Math.round(pitch*i+(pitch-wc*cell)/2),Math.random()*2500,120+Math.random()*100));
let last=performance.now();
function frame(t){if(!T.on)return;const dt=Math.min(100,t-last);last=t;
ctx.clearRect(0,0,cv.width,cv.height);bs.forEach(b=>{b.update(dt);b.draw()});
T.raf=requestAnimationFrame(frame)}
T.on=true;T.raf=requestAnimationFrame(frame)}
function stopTetris(){T.on=false;cancelAnimationFrame(T.raf);const cv=document.getElementById("tc");if(cv)cv.getContext("2d").clearRect(0,0,cv.width,cv.height)}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(T.on)startTetris()},300)});

[[0,1],[0,2],[1,0],[1,1]].forEach(([r,c])=>{const cu=document.createElement("div");cu.className="cu";cu.style.cssText=`width:${S}px;height:${S}px;transform:translate3d(${c*S}px,${r*S}px,0)`;
for(let f=1;f<=6;f++){const fe=document.createElement("i");fe.className="f"+f;fe.style.transform=["","translateZ("+S/2+"px)","rotateY(180deg) translateZ("+S/2+"px)","rotateY(90deg) translateZ("+S/2+"px)","rotateY(-90deg) translateZ("+S/2+"px)","rotateX(90deg) translateZ("+S/2+"px)","rotateX(-90deg) translateZ("+S/2+"px)"][f];cu.appendChild(fe)}
sh.appendChild(cu)});

const D=1800;
const anim=pc.animate([
{transform:"translate3d(-45vw,-35vh,-3200px) rotateX(70deg) rotateY(-50deg) rotateZ(0deg)",offset:0},
{transform:"translate3d(-12vw,-5vh,-900px) rotateX(220deg) rotateY(110deg) rotateZ(100deg)",offset:.42},
{transform:"translate3d(0,0,780px) rotateX(340deg) rotateY(200deg) rotateZ(210deg)",offset:.7},
{transform:"translate3d(6vw,3vh,950px) rotateX(400deg) rotateY(250deg) rotateZ(260deg)",offset:.86},
{transform:"translate3d(10vw,6vh,1300px) rotateX(440deg) rotateY(290deg) rotateZ(300deg)",offset:1}
],{duration:D,easing:"cubic-bezier(.45,.05,.55,.95)",fill:"forwards"});
beep(180,.12);setTimeout(()=>beep(300,.12),D*.35);

await anim.finished;
ov.remove()}

menu();
